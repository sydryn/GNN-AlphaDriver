[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-alphadriver"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.1,<3",
    "torch>=2.6,<3",
    "torch-geometric>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
live = ["alphagenome==0.11.0"]
test = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
